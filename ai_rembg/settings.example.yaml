server:
  host: 0.0.0.0
  port: 9005
  debug: false
  log_to_file: true

service:
  name: ai_rembg

comfyui:
  base_url: http://127.0.0.1:8188
  timeout_seconds: 300
  poll_interval_seconds: 1
  concurrency: 1
  workflow_path: resources/workflow.json
  workflow_input_node_id: "1"
  workflow_input_field: image
  workflow_save_node_id: "8"
  client_id: ""

nacos:
  enabled: "true"
  server_addr: 127.0.0.1:8848
  service_name: ai-rembg-service
  namespace: ""
  group: DEFAULT_GROUP
  username: nacos
  password: nacos
